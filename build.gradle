plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.authsystem.plugin'
version = '1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://oss.sonatype.org/content/groups/public/') }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'

    implementation 'de.mkammerer:argon2-jvm:2.11'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    executable = 'D:/bin/java.exe'
}

jar {
    enabled = false
}

shadowJar {
    archiveFileName.set('AegisAuth-1.0.1.jar')
    archiveClassifier.set('')
    relocate 'de.mkammerer.argon2', 'com.authsystem.plugin.libs.argon2'
    relocate 'com.zaxxer.hikari', 'com.authsystem.plugin.libs.hikari'
    relocate 'com.github.benmanes.caffeine', 'com.authsystem.plugin.libs.caffeine'
}

task obfuscate(type: JavaExec, dependsOn: shadowJar) {
    executable = "${System.getProperty('java.home')}/bin/java.exe"
    classpath = files('lib/allatori.jar') + configurations.compileClasspath
    mainClass = 'com.allatori.Obfuscate'
    args 'allatori.xml'

    doLast {
        def originalJar = file('build/libs/AegisAuth-1.0.1.jar')
        def obfuscatedJar = file('build/libs/AegisAuth-1.0.1-obfuscated.jar')
        if (obfuscatedJar.exists()) {
            originalJar.delete()
            obfuscatedJar.renameTo(originalJar)
        }
    }
}

build {
    dependsOn obfuscate
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
