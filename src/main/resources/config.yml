language: "vi"

database:
  type: "SQLITE"
  sqlite:
    file: "auth_database.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft_auth"
    username: "root"
    password: ""
    use-ssl: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout-ms: 30000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000

security:
  argon2:
    iterations: 3
    memory-kb: 65536
    parallelism: 1
  password:
    min-length: 6
    max-length: 32
    require-letter-and-number: false
    blacklisted-passwords:
      - "123456"
      - "password"
      - "12345678"
      - "qwerty"
      - "admin123"

session:
  enabled: true
  ttl-minutes: 720

rate-limit:
  enabled: true
  max-failed-attempts: 5
  lockout-duration-minutes: 60

auth-timeout:
  seconds: 60
  reminder-interval-seconds: 10

messages:
  prefix: "<gradient:#00c6ff:#0072ff>[AegisAuth]</gradient> "

  register-prompt: "<yellow>Vui lòng đăng ký tài khoản:</yellow> <white>Gõ <yellow>/register <mật khẩu> <xác nhận></yellow> để bắt đầu chơi.</white>"
  register-success: "<green>Đăng ký tài khoản thành công! Chúc bạn chơi game vui vẻ.</green>"
  register-already: "<red>Tài khoản của bạn đã được đăng ký! Dùng /login <mật khẩu>.</red>"
  register-password-mismatch: "<red>Mật khẩu xác nhận không trùng khớp! Vui lòng thử lại.</red>"
  register-password-too-short: "<red>Mật khẩu quá ngắn! Tối thiểu phải có <yellow>{min}</yellow> ký tự.</red>"
  register-password-too-long: "<red>Mật khẩu quá dài! Tối đa chỉ được <yellow>{max}</yellow> ký tự.</red>"
  register-password-blacklisted: "<red>Mật khẩu quá đơn giản và không an toàn! Vui lòng chọn mật khẩu khác.</red>"
  register-usage: "<red>Cú pháp: /register <mật khẩu> <xác nhận mật khẩu></red>"

  login-prompt: "<aqua>Vui lòng đăng nhập:</aqua> <white>Gõ <aqua>/login <mật khẩu></aqua> để mở khóa nhân vật.</white>"
  login-success: "<green>Đăng nhập thành công! Chào mừng bạn quay trở lại server.</green>"
  login-already: "<yellow>Bạn đã đăng nhập vào hệ thống rồi!</yellow>"
  login-not-registered: "<red>Tài khoản này chưa đăng ký! Dùng /register <mật khẩu> <xác nhận>.</red>"
  login-wrong-password: "<red>Mật khẩu không chính xác! Bạn đã bị ngắt kết nối.</red>"
  login-session-restored: "<green>Đã tự động đăng nhập thông qua Session IP an toàn.</green>"
  login-usage: "<red>Cú pháp: /login <mật khẩu></red>"

  changepass-success: "<green>Đổi mật khẩu thành công!</green>"
  changepass-wrong-old: "<red>Mật khẩu cũ không chính xác!</red>"
  changepass-same-as-old: "<red>Mật khẩu mới không được trùng với mật khẩu cũ!</red>"
  changepass-not-logged-in: "<red>Bạn phải đăng nhập trước khi đổi mật khẩu!</red>"
  changepass-usage: "<red>Cú pháp: /changepassword <mật khẩu cũ> <mật khẩu mới></red>"

  premium-prompt-confirm: |
    <yellow>[CẢNH BÁO PREMIUM]</yellow>
    <yellow>Bạn đang kích hoạt chế độ Tự Động Đăng Nhập Bản Quyền (Premium).</yellow>
    <white>LƯU Ý: Bạn chỉ có thể đăng nhập bằng tài khoản Mojang/Microsoft chính chủ có tên này.</white>
    <white>Gõ <gold>/premiumconfirm</gold> trong vòng <aqua>60 giây</aqua> để xác nhận.</white>

  premium-already: "<yellow>Tài khoản của bạn đã ở chế độ Premium!</yellow>"
  premium-not-registered: "<red>Tài khoản của bạn chưa được đăng ký! Vui lòng dùng /register trước khi kích hoạt Premium.</red>"
  premium-not-mojang: "<red>Tên nhân vật của bạn không tồn tại trên hệ thống Mojang chính chủ!</red>"
  premium-no-pending: "<red>Bạn chưa kích hoạt lệnh /premium hoặc phiên xác nhận đã hết hạn (60s)!</red>"
  premium-confirmed: "<green>Kích hoạt chế độ Premium thành công! Từ lần sau bạn sẽ được tự động đăng nhập.</green>"
  premium-auto-login: "<green>Xác thực tài khoản Mojang Premium thành công! Đã tự động đăng nhập.</green>"

  action-blocked: "<red>Bạn cần phải đăng nhập hoặc đăng ký trước khi thực hiện hành động này!</red>"
  timeout-kick: "<red>Bạn đã bị ngắt kết nối vì không đăng nhập/đăng ký đúng thời gian!</red>"
  duplicate-online-kick: "<red>Tài khoản này đã có người đang đăng nhập trên máy chủ!</red>"
  rate-limited-kick: "<red>Địa chỉ IP của bạn bị tạm khóa trong {minutes} phút do nhập sai mật khẩu quá 5 lần!</red>"

  admin-unpremium-success: "<green>Đã hủy chế độ Premium cho <yellow>{player}</yellow> thành công!</green>"
  admin-unpremium-not-premium: "<yellow>Tài khoản của <player> hiện không ở chế độ Premium!</yellow>"
  admin-unpremium-usage: "<red>Cú pháp: /unpremium <người chơi></red>"
  admin-language-changed-vi: "<green>✔ Đã chuyển toàn bộ ngôn ngữ giao diện plugin sang <yellow>Tiếng Việt</yellow>!</green>"
  admin-language-changed-en: "<green>✔ Entire plugin system language changed to <yellow>English</yellow>!</green>"
  admin-player-not-found: "<red>Không tìm thấy dữ liệu tài khoản <yellow>{player}</yellow>!</red>"
  admin-reload-success: "<green>Đã nạp lại toàn bộ cấu hình AegisAuth!</green>"
  admin-unregister-success: "<green>Đã xóa tài khoản <yellow>{player}</yellow> khỏi hệ thống!</green>"
  admin-unregister-player-online: "<red>Người chơi <yellow>{player}</yellow> đang online! Người chơi phải offline trước khi thực hiện unregister.</red>"
  admin-unregister-usage: "<red>Cú pháp: /unregister <người chơi></red>"
  admin-no-permission: "<red>Bạn không có quyền hạn thực hiện lệnh này!</red>"
  admin-usage: "<red>Cú pháp: /authadmin <reload|unregister> [player]</red>"
  player-only: "<red>Lệnh này chỉ dành cho người chơi trong game!</red>"

  title-welcome-header: "<gradient:#00c6ff:#0072ff>CHÀO MỪNG</gradient>"
  title-welcome-footer: "<gray>Vui lòng đăng nhập hoặc đăng ký để tiếp tục</gray>"
  actionbar-login-countdown: "<yellow>Thời gian đăng nhập còn lại: <red>{seconds}s</red> | Gõ: <aqua>/login <pass></aqua></yellow>"
  actionbar-register-countdown: "<yellow>Thời gian đăng ký còn lại: <red>{seconds}s</red> | Gõ: <gold>/register <pass> <pass></gold></yellow>"
  language-usage: "<yellow>Cú pháp: /language <vietnamese|english> (Hoặc: /lang <vi|en>)</yellow>"

  en:
    prefix: "<gradient:#00c6ff:#0072ff>[AegisAuth]</gradient> "

    register-prompt: "<yellow>Please register your account:</yellow> <white>Type <yellow>/register <password> <confirm></yellow> to start playing.</white>"
    register-success: "<green>Account registered successfully! Have fun playing.</green>"
    register-already: "<red>Your account is already registered! Use /login <password>.</red>"
    register-password-mismatch: "<red>Confirmation password does not match! Please try again.</red>"
    register-password-too-short: "<red>Password too short! Minimum required is <yellow>{min}</yellow> characters.</red>"
    register-password-too-long: "<red>Password too long! Maximum allowed is <yellow>{max}</yellow> characters.</red>"
    register-password-blacklisted: "<red>Password is too simple and unsafe! Please choose another password.</red>"
    register-usage: "<red>Usage: /register <password> <confirmPassword></red>"

    login-prompt: "<aqua>Please log in:</aqua> <white>Type <aqua>/login <password></aqua> to unlock your character.</white>"
    login-success: "<green>Logged in successfully! Welcome back to the server.</green>"
    login-already: "<yellow>You are already logged in to the system!</yellow>"
    login-not-registered: "<red>This account is not registered! Use /register <password> <confirm>.</red>"
    login-wrong-password: "<red>Incorrect password! You have been disconnected.</red>"
    login-session-restored: "<green>Auto-logged in via secure IP Session.</green>"
    login-usage: "<red>Usage: /login <password></red>"

    changepass-success: "<green>Password changed successfully!</green>"
    changepass-wrong-old: "<red>Old password is incorrect!</red>"
    changepass-same-as-old: "<red>New password cannot be the same as old password!</red>"
    changepass-not-logged-in: "<red>You must log in before changing password!</red>"
    changepass-usage: "<red>Usage: /changepassword <oldPassword> <newPassword></red>"

    premium-prompt-confirm: |
      <yellow>[PREMIUM WARNING]</yellow>
      <yellow>You are activating Premium Auto-Login mode.</yellow>
      <white>NOTE: You can only log in with an official Mojang/Microsoft account under this username.</white>
      <white>Type <gold>/premiumconfirm</gold> within <aqua>60 seconds</aqua> to confirm.</white>

    premium-already: "<yellow>Your account is already in Premium mode!</yellow>"
    premium-not-registered: "<red>Your account is not registered! Please use /register before activating Premium.</red>"
    premium-not-mojang: "<red>Your username does not exist on official Mojang servers!</red>"
    premium-no-pending: "<red>You have not run /premium or confirmation session expired (60s)!</red>"
    premium-confirmed: "<green>Premium mode activated successfully! You will auto-login next time.</green>"
    premium-auto-login: "<green>Mojang Premium authentication successful! Auto-logged in.</green>"

    action-blocked: "<red>You need to log in or register before performing this action!</red>"
    timeout-kick: "<red>You were disconnected for not logging in/registering in time!</red>"
    duplicate-online-kick: "<red>An account with this name is already logged in on the server!</red>"
    rate-limited-kick: "<red>Your IP address is temporarily locked for {minutes} minutes due to entering the wrong password 5 times!</red>"

    admin-unpremium-success: "<green>Disabled Premium mode for <yellow>{player}</yellow> successfully!</green>"
    admin-unpremium-not-premium: "<yellow>Account <player> is not currently in Premium mode!</yellow>"
    admin-unpremium-usage: "<red>Usage: /unpremium <player></red>"
    admin-language-changed-vi: "<green>✔ Entire plugin system language changed to <yellow>Vietnamese</yellow>!</green>"
    admin-language-changed-en: "<green>✔ Entire plugin system language changed to <yellow>English</yellow>!</green>"
    admin-player-not-found: "<red>Account data for <yellow>{player}</yellow> was not found!</red>"
    admin-reload-success: "<green>AegisAuth configuration reloaded successfully!</green>"
    admin-unregister-success: "<green>Deleted account <yellow>{player}</yellow> from the system!</green>"
    admin-unregister-player-online: "<red>Player <yellow>{player}</yellow> is online! Player must be offline to unregister.</red>"
    admin-unregister-usage: "<red>Usage: /unregister <player></red>"
    admin-no-permission: "<red>You do not have permission to execute this command!</red>"
    admin-usage: "<red>Usage: /authadmin <reload|unregister> [player]</red>"
    player-only: "<red>This command is for in-game players only!</red>"

    title-welcome-header: "<gradient:#00c6ff:#0072ff>WELCOME</gradient>"
    title-welcome-footer: "<gray>Please log in or register to continue</gray>"
    actionbar-login-countdown: "<yellow>Login time remaining: <red>{seconds}s</red> | Type: <aqua>/login <pass></aqua></yellow>"
    actionbar-register-countdown: "<yellow>Register time remaining: <red>{seconds}s</red> | Type: <gold>/register <pass> <pass></gold></yellow>"
    language-usage: "<yellow>Usage: /language <language> (Or: /lang <language>)</yellow>"
